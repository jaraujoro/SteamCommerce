spring.application.name=SteamCommerce
server.port=${SERVER_PORT}

# ========================================================
# PostgreSQL Database Configuration
# ========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ========================================================
# JPA / Hibernate Configuration
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# CORS / Frontend Configuration (Orígenes permitidos)
# ========================================================
app.cors.allowed-origins=${ALLOWED_FRONT}

# ========================================================
# URLS
# ========================================================
backend.url=${ALLOWED_HOST}
frontend.url=${ALLOWED_FRONT}


# ========================================================
# JWT Configuration
# ========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ========================================================
# STEAM API Configuration
# ========================================================
steam.api-key=${STEAM_API_KEY}
steam.bot-id=${STEAM_BOT_ID}
steam.bot-trade-url=${STEAM_BOT_TRADE_URL}


