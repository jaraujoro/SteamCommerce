services:
  # ========================================================
  # Base de Datos PostgreSQL
  # ========================================================
  postgres:
    image: postgres:15-alpine
    container_name: steam_commerce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - steam_network

  # ========================================================
  # Backend Spring Boot (Empaquetado en JAR)
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steam_commerce_backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      
      # DB
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # BACK
      ALLOWED_HOST: ${ALLOWED_HOST}

      # FRONT
      ALLOWED_FRONT: ${ALLOWED_FRONT}

      # STEAM
      STEAM_API_KEY: ${STEAM_API_KEY}
      STEAM_BOT_ID: ${STEAM_BOT_ID}
      STEAM_BOT_TRADE: ${STEAM_BOT_TRADE}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - steam_network

volumes:
  postgres_data:
    driver: local

networks:
  steam_network:
    driver: bridge